# =============================================================================
# Framework workbench: Open WebUI + JupyterLab (daharness kernel lane)
#
# 2026-11-18 transplant: open-webui moved back in from the retired
# /home/surzal/daharness/dockered stack. code-server stays retired — the
# trimmed shape is jupyter + jupyter-gate + open-webui only.
#
# The workbench network stays INTERNAL: the kernel container has no routed
# egress at all — the notebook lane is a compute sandbox whose only
# sanctioned outbound path is the Brain UDS socket (/run/daharness/brain.sock,
# a filesystem path, untouched by network namespaces), with every framework
# tool executing HOST-side through the executor's scope gate. Host-bound
# addresses still work from an internal network: the workbench bridge
# gateway 172.28.0.1 reaches the host's daharness-pg cluster (:5433).
#
# open-webui is the only service that straddles planes (same pattern as
# jupyter-gate): workbench (internal) for the direct code-interpreter lane
# to jupyter:8888, mgmt LAST so it wins the default route — egress to the
# host-lane Ollama must NAT through mgmt; an
# internal-network default route would plain-route into the host and break
# SNAT for the LAN. Its 3000 publishes via mgmt (NAT is not programmed on
# internal networks — see jupyter's NOTE below).
#
# INBOUND: Docker does NOT program NAT/port publishing for containers on an
# internal network, so a `ports:` entry on the jupyter service is silently
# ignored (observed 2026-11-18: PORTS={} in docker inspect, no
# docker-proxy). The browser 8888 rides through the jupyter-gate nginx
# sidecar, a static inbound-only proxy with no exec surface — the sandbox
# boundary (jupyter has no egress) is untouched. The open-webui
# server-to-server lane bypasses the gate entirely (docker DNS on the
# internal bridge) — the gate is for browsers only.
#
# The framework ships as the daharness .deb: code tree bind-mounted from
# /usr/share/daharness, Brain socket /run/daharness/brain.sock, shared state
# root /var/lib/daharness (both PATH-identical). START ORDER MATTERS:
# `sudo systemctl enable --now daharness` BEFORE `compose up -d` —
# /run/daharness is the unit's RuntimeDirectory tmpfs; binds carry
# create_host_path=false so up fails loudly instead of docker silently
# mkdir-ing an empty dir that the daemon's tmpfs would then overmount.
#
# HOME PERSISTENCE: /home/jovyan is a whole-home bind to /dadev/jupyterhome
# (uid 1000/gid 100 = jovyan = surzal's id) — dotfiles, IPython history,
# .claude logins and the notebooks dir all survive container removes and
# recreates. If /dadev/jupyterhome is ever lost, recreate + reseed before
# `compose up` (see the volume comment block on the jupyter service).
# The old /home/kali/jupyter-home/.ipython sliver lane is retired.
#
# The shipped daharness unit now sets RuntimeDirectoryPreserve=restart
# (2026-10-22): `systemctl restart` — and Restart=on-failure restarts —
# keep the tmpfs mounted, so the /run binds below survive daemon restarts.
# A full `systemctl stop && start` cycle still recreates the tmpfs; the
# lanes' binds then pin the dead generation (empty /run/daharness inside,
# brain.sock ENOENT — observed 2026-10-21). Fix: docker compose up -d
# --force-recreate jupyter after any full stop.
#
# JupyterLab:  http://<host>:8888         (tool nursery; served through jupyter-gate; JUPYTER_TOKEN)
# Open WebUI:  http://<host>:3000         (chat front end; LLM configured in Open WebUI;
#                                          code-execution lane = jupyter over the internal bridge,
#                                          CODE_INTERPRETER_JUPYTER_* env shared with JUPYTER_TOKEN)
#                                          local speech/TTS lane is disabled to preserve Pi memory
#
#   cd dockered
#   docker compose build && docker compose up -d
#
# Tokens live in dockered/.env (gitignored; see .git/info/exclude too).
# ==============================================================================
services:
  # ─────────────────────────────────────────────────────────────────────────
  # JupyterLab — notebook/code-execution workbench.
  #
  # This is intentionally a separate lane from the host lane where the
  # framework gateway + Brain run. The live
  # framework tree is mounted so the daharness kernelspec and gateway wiring
  # can be configured manually while experimenting with Open WebUI's code
  # execution integration.
  # ─────────────────────────────────────────────────────────────────────────
  jupyter:
    build:
      context: .. # carries the Dockerfile + the root requirements.txt the image COPYs
      # The framework's build-time copy comes from the deb's installed tree
      # via a named context (the deb ships no requirements.txt, so that one
      # file still COPYs off the main repo context).
      additional_contexts:
        framework-src: /usr/share/daharness
      dockerfile: dockered/jupyter.Dockerfile
      # Build in the host network namespace. BuildKit's default isolated
      # namespace was intermittently unable to resolve public names
      # (2026-10-21: "Temporary failure resolving 'archive.ubuntu.com'"
      # mid-build, while host DNS via dnsmasq + 75.75.75.75 was fine).
      # host network lets the build container hit the host's resolv.conf
      # directly — same path `docker run` uses successfully. Build-only;
      # the runtime container gets the internal workbench bridge below
      # (no egress adapter, no dns: pin — see the networks section).
      network: host
    # NOTE: no `ports:` on this service. Docker silently ignores port
    # publishing on an internal network (no DNAT is programmed — PORTS={}
    # in `docker inspect`, observed 2026-11-18); inbound 8888 is fronted
    # by the jupyter-gate sidecar at the bottom of this file.
    # INTERNAL network only — the egress adapter is gone and the dnsmasq
    # `dns:` pin with it (no dnsmasq set up on this host anymore; see
    # knowledge/lab-dns.md). Sandbox shape (compose header): raw notebook
    # network calls have no route off the bridge; every framework tool
    # executes HOST-side through the Brain UDS socket + scope gate.
    # Container DNS is Docker's embedded resolver forwarding via the host's
    # own upstream — public names still resolve; lab names are NOT expected
    # to resolve in-container (target resolution belongs to the host-side
    # executor and kali's /etc/hosts).
    networks:
      workbench:
        ipv4_address: 172.28.0.40
    volumes:
      # The deb's framework tree. Read-only, ENFORCED (the :ro suffix): the
      # container reads tool code, nothing writes into it — stub gen targets
      # /opt/conda/share/framework-stubs + work/ (and PYTHONDONTWRITEBYTECODE
      # below stops even .pyc rewrite attempts when a deb file update shifts
      # an mtime past its cached cpython-313.pyc; the tree ships root:root so
      # jovyan already couldn't write it — :ro makes that a mount property
      # instead of an ownership accident). The ruff.toml builtins side-block
      # is a checkout-only lane the deb tree omits by design (generator warns
      # and continues).
      - /usr/share/daharness:/home/jovyan/framework:ro
      # Shared state, PATH-IDENTICAL so constants resolve identically in- and
      # out-of-container: cookie jar/ids.db/scratch live beside the daemon's
      # /var/lib/daharness; brain.sock rides the daemon's runtime tmpfs.
      # create_host_path=false → compose up refuses to start before the
      # daemon (wrong-source mkdir would be shadowed when the tmpfs lands).
      - type: bind
        source: /var/lib/daharness
        target: /var/lib/daharness
        bind:
          create_host_path: false
      # AUTHORITY BOUNDARY — the whole root stays rw by contract (shared
      # state: cookie jar/ids.db/scratch/evidence mirror, PATH-identical with
      # the host daemon), but the armed-state subdirs are OPERATOR-AUTHORITY
      # territory and are overlaid READ-ONLY on the kernel lane (same
      # stacking pattern as the jupyter-nbi bind above; later binds win on
      # the same target subtree). Verified live 2026-11-21 before the fix:
      # jovyan (gid 119=daharness) could create files inside scope/ AND
      # rewrite .armed_packet_scope.json (group-writable file) — the armed
      # manifest is the scope gate's ENTIRE enforcement basis and arming is
      # operator-only (utils/scope_gate.py, knowledge/scope_gate.md).
      #   scope/      armed state + manifests. Kernel-lane writes there
      #               (program-scope manifest cache, amass .scope file, ZAP
      #               protect-sync sidecar) are all best-effort with OSError
      #               containment in the deb tree (_program_scope_store.py:
      #               "_scope cache write failed (best-effort, ignored)") —
      #               EROFS degrades to a warning, nothing fatal. The setgid
      #               host dir keeps mtime-checks working through the bind
      #               (reads pass; the operator arms/disarms HOST-side, whose
      #               writes land on the same inodes the bind shares).
      #   engagement/ armed-engagement state (.armed_engagement.json) — same
      #               operator-only arming model (utils/engagement.py). The
      #               kernel lane writes nothing here (arm/disarm/purge are
      #               REPL/CLI-only; journal/evidence live in Postgres + the
      #               separate evidence/ dir, which stays rw).
      #   dacustoms/  THE EXCEPTION (rw) — an operator sandbox: operator-
      #               authored customs modules the host Brain imports at
      #               discovery (DACUSTOMS_DIR=/var/lib/daharness/dacustoms
      #               in /etc/daharness/daharness.env). Kernel-side writes
      #               here are intended — customs live in shared group state
      #               so every lane sees them; treat the module code itself
      #               as agent-authored by design (review before import).
      - type: bind
        source: /var/lib/daharness/scope
        target: /var/lib/daharness/scope
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/daharness/engagement
        target: /var/lib/daharness/engagement
        read_only: true
        bind:
          create_host_path: false
      # dacustoms/ deliberately NOT overlaid ro — sandbox exception, see the
      # comment block above. It rides the parent /var/lib/daharness rw bind.
      - type: bind
        source: /run/daharness
        target: /run/daharness
        bind:
          create_host_path: false
      # Whole-home persistence — /home/jovyan survives container removes and
      # image recreates (dotfiles, .claude logins, .local pip installs, IPython
      # history, notebooks under work/). Host dir seeded 2026-11-20 from the
      # live container's home; OWNERSHIP CONTRACT: host tree must be
      # uid 1000 (= jovyan) + gid 100 (= users, surzal's supplementary group).
      # The image's `fix-permissions /home/jovyan` layer is shadowed by this
      # bind — if the seed dir is ever lost, recreate it before `compose up`:
      #   sudo mkdir -p /dadev/jupyterhome && sudo chown 1000:100 /dadev/jupyterhome
      # (a root-owned dir here silently breaks the whole lane — first boot
      # mkdirs fail; the same bug killed the old .ipython bind, see git log).
      # Image-baked home content is effectively dead weight under this bind;
      # runtime-booted state (10-refresh-stubs etc.) still lands correctly.
      - /dadev/jupyterhome:/home/jovyan

      # Persistent notebook-intelligence settings + the stored GitHub token so
      # image rebuilds don't wipe the Copilot login. Contains credentials —
      # gitignored as dockered/jupyter-nbi/. Stacked OVER the whole-home bind
      # above (later bind wins on the same target subtree); the home bind's
      # seeded .jupyter/nbi stays empty and unused.
      - ./jupyter-nbi:/home/jovyan/.jupyter/nbi

      # Env-level NBI config baked by the Dockerfile, bind-mounted read-only:
      # NBI layers the env-prefix file under the user file, so this is the
      # rebuild-proof baseline for settings the Settings UI never re-persists
      # (notably chatbook_backend_kernel — without it Chatbook code runs on
      # python3 and loses the framework-tool stubs + rules).
      - ./jupyter-nbi-config.json:/opt/conda/share/jupyter/nbi/config.json:ro

      # pyrightconfig for the jupyterlab-lsp pyright lane: NOT mounted — work/
      # lives on the whole-home host bind (/dadev/jupyterhome) and the image
      # cannot bake into it. The before-
      # notebook.d hook (10-refresh-stubs.sh) copies the baked config from
      # /opt/conda/share/jupyter/pyrightconfig.d/ on every boot (only if the
      # operator hasn't pinned their own). Config ships read-only-lane
      # posture: typeCheckingMode=off + stubPath → the stub dir + extraPaths
      # carrying the live framework tree for hover/completion on
      # framework-internal imports; unknown bare names still flag. Keep
      # dockered/jupyter.Dockerfile's baked heredoc and stubPath in sync if
      # editing by hand.
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - JUPYTER_MAPPINGKERNELMANAGER_DEFAULT_KERNEL_NAME=daharness
      # Ollama SDK inside NBI must reach the host through the dual-homed
      # jupyter-gate; the kernel lane itself has no LAN route.
      - OLLAMA_HOST=http://jupyter-gate:8888/ollama
      # FRAMEWORK_GATEWAY_URL / OLLAMA_HOST dropped 2026-11-18: the gateway
      # env pointed at the retired open-terminal container (nothing in the
      # deb tree reads it — the kernel dispatches via the Brain socket, and
      # the remote Open WebUI's bridge reaches the host gateway through its
      # own gateway_url valve), and the NBI Ollama lane has no route on the
      # internal workbench network anyway.
      # Host lane wiring (post-.deb): Brain socket + the daemon's shared
      # state root — see the PATH-identical mounts above + header start order.
      - BRAIN_SOCKET=/run/daharness/brain.sock
      - WORKSPACE_ROOT=/var/lib/daharness
      # Host-native daharness-pg cluster (deb wrapper, :5433 — NOT a compose
      # service). Containers reach it through the workbench-bridge gateway
      # 172.28.0.1; pinning HARNESS_DB_HOST makes both the engagement lane
      # (utils.engagement._host_candidates) and framework_doctor's postgres
      # probe resolve the cluster deterministically instead of relying on
      # the built-in 127.0.0.1-then-172.28.0.1 fallback order (the loopback
      # first-try fails instantly against the host-native cluster from
      # inside a container, costing one timeout per connect).
      - HARNESS_DB_HOST=172.28.0.1
      - HARNESS_DB_PORT=5433
      # SCRUB (see the LANE-ROLL-PROOF note above): pg.env via env_file
      # pours ALL lane passwords + the host-loopback pins into the kernel
      # env; explicit environment wins the merge, so these entries blank
      # or re-pin everything the lane must not see — only the repl_lane
      # credential survives into the container (the kernel is agent-
      # executed code and can read its own env; brain/gateway/operator
      # secrets stay host-side, keeping engagement.purge() operator-only).
      - HARNESS_DB_NAME=harness
      - HARNESS_DB_PASSWORD_OPERATOR=
      - HARNESS_DB_PASSWORD_BRAIN=
      - HARNESS_DB_PASSWORD_GATEWAY=
      # The engagement lane authenticates per-DB-role; host lanes get the
      # minted lane passwords via the systemd units' EnvironmentFile
      # (/etc/daharness/pg.env, root:daharness 0640 — never the compose
      # .env: that file is the gitignored repo-local secret store, while
      # pg.env is operator-managed on the host). `daharness-pg init`
      # default passwords (harness_*_change_me) are placeholders — the
      # live cluster rolls random hex per lane, so the kernel lane must
      # carry the real repl_lane value or every dispatch journals
      # "password authentication failed" (observed 2026-11-19 from every
      # open-webui execute_code kernel run). Only the REPL lane's
      # credential is passed through: the kernel is agent-executed code
      # and can read its own env, so brain/gateway/operator secrets stay
      # host-side (engagement.purge() would no longer be operator-only).
      # LANE-ROLL-PROOF (2026-11-21): the credential is no longer copied
      # through dockered/.env — ${JUPYTER_LANE_HARNESS_DB_PASSWORD_REPL}
      # went blank on every lane roll (pg.env is rewritten by the lane
      # machinery; compose interpolation only ever saw the stale/missing
      # .env copy → "fe_sendauth: no password supplied" from every kernel
      # dispatch, reproduced live 2026-11-21). Instead the jupyter service
      # sources /etc/daharness/pg.env DIRECTLY via env_file below: compose
      # re-reads the file at config time on every up, so lane rolls flow
      # in on the next `docker compose up -d --force-recreate jupyter`.
      # Requires the invoking user to read pg.env (surzian is in the
      # daharness group; file is 0640 root:daharness). Precedence:
      # environment wins over env_file, so the SCRUB entries below blank
      # the three non-repl passwords (plus pg.env's HARNESS_DB_HOST/PORT/
      # NAME, which describe the host loopback and would override the
      # container pins above) — only the repl credential reaches the
      # kernel env. Host-side lanes keep their systemd EnvironmentFile.
      # Lane role pin: the kernel entry point infers repl_lane anyway
      # (see utils.engagement._infer_lane_from_entrypoint); pinning it
      # keeps attribution explicit and immune to future entry-point
      # renames.
      - HARNESS_DB_LANE=repl_lane
      # Stub-gen + the kernel import the deb tree; don't let CPython try to
      # refresh the root-owned __pycache__ dirs on it — with the tree now
      # mounted :ro the attempt surfaces as a stack-trace-noise warning
      # ("Failed to write .pyc") on every kernel boot after a deb refresh
      # bumps an mtime past the shipped cache. (The kernel's own import floor
      # still works — a failed pyc write is non-fatal by design.)
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      # Minted lane passwords + host loopback pins (see the LANE-ROLL-PROOF
      # note above for the authority model and the SCRUB list in
      # environment).
      - path: /etc/daharness/pg.env
        required: true
    # Lane role pin + bytecode discipline live in the single environment
    # block above; env_file only pours the minted pg.env lane vars, which
    # the environment block then overrides (precedence: environment >
    # env_file).
    command:
      - start-notebook.py
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.allow_root=False
      - --ServerApp.token=${JUPYTER_TOKEN}
      - --ServerApp.root_dir=/home/jovyan/work
      - --MappingKernelManager.default_kernel_name=daharness
    group_add:
      - "119" # host daharness GID (getent group daharness) — group rwx on /run
              # and /var/lib/daharness dirs (0770/2770 setgid).
    # Custom healthcheck — two reasons we don't use the base image's
    # docker_healthcheck.py here:
    #   1. The stock script's ~1s budget can't cover this image (nbi + MCP
    #      server + tool registrations boot before /api answers).
    #   2. Since nbi added its "Jupyter MCP Server" sidecar
    #      (jpserver-mcp-8.json in the runtime dir, url .../mcp), the stock
    #      script's `next(runtime_dir.glob("*server-*.json"))` picks WHICH
    #      file is nondeterministic and then blind-appends "api" -> probing
    #      /mcpapi -> permanent 404 -> a Jupyter that is perfectly healthy
    #      reported "unhealthy" forever.
    # Probe the ServerApp port directly; urlopen follows the / -> /login
    # redirect chain, which serves HTTP 200 unauthenticated, so reachability
    # alone decides health (token auth is exercised by consumers).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/', timeout=10)\""]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # jupyter-gate — inbound front door for the internal kernel lane.
  #
  # Docker does not program NAT/port publishing for containers on an
  # internal network (jupyter's own `ports:` was silently ignored —
  # PORTS={}, no docker-proxy, 8888 unreachable behind the internal bridge,
  # 2026-11-18). This static nginx sidecar straddles the internal workbench
  # bridge and a plain published mgmt bridge: it publishes 8888 on the host
  # and proxy-passes into the sandbox with proper Upgrade/WebSocket wiring.
  # Nothing else is exposed; the proxy has no exec surface, and jupyter
  # itself stays off the published plane and has no egress — the sandbox
  # boundary survives. Static IP pinned on the internal side so host-side
  # diagnostics (`curl 172.28.0.40:8888`) keep a stable address to aim at.
  # ─────────────────────────────────────────────────────────────────────────
  jupyter-gate:
    image: nginx:alpine
    depends_on:
      - jupyter
    ports:
      - "8888:8888"
    networks:
      workbench:
        ipv4_address: 172.28.0.35
      # Attached second; a non-internal adapter may win the default route,
      # but the gate needs no outbound — DNS is docker's embedded resolver.
      mgmt:
    volumes:
      - ./jupyter-gate.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # open-webui — chat front end, transplanted back from the retired
  # daharness/dockered stack (2026-11-18; code-server stays retired).
  #
  # Straddle (same pattern as jupyter-gate): attached to workbench FIRST
  # (internal bridge — the code-interpreter lane talks to jupyter:8888
  # directly via docker DNS, no gate hop, server-to-server with ?token=)
  # and mgmt LAST (wins the default route → egress to the host-lane Ollama
  # at 10.0.0.245:11434 NATs correctly; an internal-network default route
  # would plain-route into the host and destroy Ollama reachability).
  # Its 3000 publishes via mgmt only. RAG embedding offloaded to Ollama; the
  # built-in sentence-transformers model (~500MB RSS at boot, kept growing —
  # host OOM-killer shot it once) stays disabled. The :dev-slim variant
  # removes the bundled CUDA/ML stack; local Ollama and Kokoro remain external
  # so those workloads stay off the OWUI process. pinned to :dev-slim —
  # v0.11.3 stable ships a broken interactive-terminal (WebSocket header)
  # attach; :dev fixes it (open-webui#29787).
  # ─────────────────────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:dev
    depends_on:
      - jupyter
      - jupyter-gate
    ports:
      - "3000:8080"
    networks:
      workbench:
        ipv4_address: 172.28.0.30
      # Attached after workbench → wins the default route for egress
      # (host LAN or local Ollama lane). Same reasoning as jupyter-gate's mgmt attachment.
      mgmt:
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Jupyter code-interpreter/execution lane. CODE_INTERPRETER_* inherits
      # from CODE_EXECUTION_* (verified in OWUI config.py), so the generic
      # vars carry both. ENV only seeds the FIRST boot's config (the webui.db
      # row wins afterwards), but the copied DB has no persisted code-interp
      # keys, so these are authoritative.
      - CODE_INTERPRETER_ENGINE=jupyter
      - CODE_EXECUTION_JUPYTER_URL=http://jupyter:8888
      # Same token as the jupyter service (single .env var). OWUI's client
      # sends it as ?token= (code_interpreter.py: params.update({'token':}))
      # — matching --ServerApp.token; no Origin is sent server-side so the
      # gate's $http_host fix isn't needed on this lane.
      - CODE_EXECUTION_JUPYTER_AUTH=token
      - CODE_EXECUTION_JUPYTER_AUTH_TOKEN=${JUPYTER_TOKEN}
      - CODE_EXECUTION_JUPYTER_TIMEOUT=600
      # Legacy session secret carried over from the old stack (extracted
      # live; .env is gitignored) so the copied webui.db stays coherent.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL_PREFIX=${WEBUI_URL_PREFIX}
      # Use the host Ollama API for RAG embeddings and keep vector storage in
      # ChromaDB (the slim image is pgvector-only).
      - OLLAMA_BASE_URL=http://10.0.0.245:11434
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - RAG_EMBEDDING_BATCH_SIZE=50
      - VECTOR_DB=chroma
      - USE_SLIM_DOCKER=false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

networks:
  # INTERNAL: no default-route/NAT off the bridge — that IS the sandbox
  # boundary for the kernel lane. Host-bound destinations (the bridge
  # gateway 172.28.0.1) remain reachable from inside, so the daharness-pg
  # (:5433) pin in the jupyter service keeps working. NOTE: no NAT and
  # therefore no port publishing exists on this network for ANY attached
  # container — inbound exposure always goes through a gate sidecar (see
  # jupyter-gate) attached to a published mgmt adapter instead.
  # DNS: Docker's embedded resolver forwards via the host's own upstream —
  # public names still resolve; the residual covert-DNS channel is noted
  # in knowledge/lab-dns.md. If some future peer service needs real LAN
  # egress, attach a second non-internal adapter to THAT service — never
  # back onto this lane.
  workbench:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Plain NAT bridge, NOT internal — exists only because NAT (and thus
  # port publishing) is not programmed on internal networks. Two purposes:
  # the gate's published 8888 (browsers → jupyter) and open-webui's
  # published 3000. The kernel lane never gets an adapter
  # here.
  mgmt:
    driver: bridge

volumes:
  open-webui-data:
