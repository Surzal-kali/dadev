# Inbound front door for the internal kernel lane (see docker-compose.yaml).
#
# Static nginx, no exec surface: proxies into jupyter:8888 with HTTP/1.1 +
# Upgrade wiring so Jupyter's kernel/terminal WebSockets survive the hop.
#
# The variable proxy_pass + resolver 127.0.0.11 form re-resolves the
# `jupyter` service name at RUNTIME (valid=10s): a jupyter recreate with a
# fresh IP is picked up automatically instead of pinning the config-load
# address for the life of the gate container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $jupyter_upstream http://jupyter:8888;

    # The notebook network is intentionally isolated from the host LAN.
    # Proxy the OpenAI-compatible API through this dual-homed gate instead.
    location = /v1 {
        proxy_pass http://10.0.0.245:47832/v1;
        proxy_http_version 1.1;
        proxy_set_header Host 10.0.0.245:47832;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://10.0.0.245:47832;
        proxy_http_version 1.1;
        proxy_set_header Host 10.0.0.245:47832;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ~ ^/api/(tags|show|generate|chat|embeddings|ps|version|pull|push|create|copy|delete|blobs)(/|$) {
        proxy_pass http://172.28.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:11434;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location = /lab/tree/work {
        return 302 /lab/tree$is_args$args;
    }

    location = /lab/tree/work/ {
        return 302 /lab/tree$is_args$args;
    }

    location / {
        proxy_pass $jupyter_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # PRESERVE the original Host INCLUDING PORT ($http_host, not $host).
        # Jupyter Server's origin check compares the browser Origin
        # (scheme://host:port) against the received Host — $host strips the
        # port, so Origin http://10.0.0.83:8888 vs Host 10.0.0.83 mismatched
        # and every kernel WebSocket 403'd with "Blocking Cross Origin
        # WebSocket Attempt" (observed 2026-11-18). $http_host keeps the
        # port and the check passes.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Kernel/terminal WebSockets are long-lived: kill the 60s defaults.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Notebook/file uploads + execute_code payloads.
        client_max_body_size 128m;
        # Don't buffer streaming kernel output.
        proxy_buffering off;
    }
}
